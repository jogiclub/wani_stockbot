<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>볼린저 밴드 반전 매매 · 왔니 주식</title>
<link rel="stylesheet" href="/static/common.css">
<script src="/static/gnb.js"></script>
<script src="/static/session.js"></script>
<style>
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 60px; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .spacer { flex: 1 1 auto; }
  .muted { color: var(--text-muted); }
  .up { color: var(--up); font-weight: 600; }
  .down { color: var(--down); font-weight: 600; }

  .warn-bar { background: color-mix(in srgb, var(--warning) 16%, transparent);
              border: 1px solid var(--warning); color: var(--text-primary);
              padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .warn-bar[hidden] { display: none; }
  .live-bar { background: color-mix(in srgb, var(--critical) 14%, transparent);
              border: 1px solid var(--critical); color: var(--text-primary);
              padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px;
              display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .live-bar[hidden] { display: none; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .tile .value { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab { padding: 9px 14px; border: 0; background: none; color: var(--text-secondary);
         border-bottom: 2px solid transparent; border-radius: 0; font-weight: 500; }
  .tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 650; }
  .tab .count { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
                background: var(--surface-2); font-size: 11px; color: var(--text-secondary); }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--surface-2); text-align: right; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th.l, td.l { text-align: left; white-space: normal; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr[data-i] { cursor: pointer; }
  tbody tr[data-i]:hover { background: var(--surface-2); }
  tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .sym { font-weight: 650; }
  .empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
  a.toss { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  a.toss:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* 액션 배지 */
  .act { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .act-BUY   { background: color-mix(in srgb, var(--up) 20%, transparent); color: var(--up); }
  .act-SELL, .act-TAKE_PROFIT { background: color-mix(in srgb, var(--down) 20%, transparent); color: var(--down); }
  .act-STOP  { background: color-mix(in srgb, var(--critical) 24%, transparent); color: var(--critical); }
  .act-HOLD  { background: var(--surface-2); color: var(--text-muted); }
  .act-ERROR, .act-NODATA { background: var(--surface-2); color: var(--text-muted); }
  .act-SYSTEM { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

  /* %B 게이지 — 하단(0) 이탈이 매수, 상단(1) 이탈이 매도 */
  .pb { position: relative; width: 90px; height: 7px; border-radius: 999px;
        background: var(--surface-2); display: inline-block; vertical-align: middle; }
  .pb i { position: absolute; top: -2px; width: 3px; height: 11px; border-radius: 2px; background: var(--text-primary); }

  /* 설정 폼 */
  .form { padding: 16px 18px; display: grid; gap: 14px; }
  .form fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0; }
  .form legend { font-size: 12px; color: var(--text-muted); padding: 0 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .form label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .form input, .form select {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); }
  .form .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .form .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .form .check input { width: 16px; height: 16px; }
  .form .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .form-msg { font-size: 12.5px; }
  .form-msg.bad { color: var(--critical); }
  .form-msg.ok { color: var(--good); }

  /* 차트 */
  .chart-wrap { padding: 14px 16px; }
  .chart-box { width: 100%; }
  .chart-box svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .picker button[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; font-weight: 650; }

  .rules { padding: 16px 18px; font-size: 13px; line-height: 1.7; }
  .rules h3 { margin: 16px 0 6px; font-size: 14px; }
  .rules h3:first-child { margin-top: 0; }
  .rules ul { margin: 0; padding-left: 18px; }
  .rules code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .rules .callout { background: color-mix(in srgb, var(--warning) 14%, transparent);
                    border: 1px solid var(--warning); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }

  footer { margin-top: 22px; font-size: 12px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div data-gnb="bollinger"></div>

<!-- GNB 우측으로 옮겨질 공통 컨트롤 (gnb.js 가 이동시킨다) -->
<span class="badge" id="status" data-gnb-action><span class="dot"></span><span id="status-text">연결 중…</span></span>
<button data-settings-btn title="내 토스 API 키 설정" data-gnb-action hidden>⚙ 설정</button>

<div class="wrap">
  <div class="page-head">
    <h1>볼린저 밴드 반전 매매<span id="mode-label"></span></h1>
    <div class="spacer"></div>
    <button id="run-btn">지금 점검</button>
    <button id="mode-btn">모의 ↔ 실주문</button>
    <button class="primary" id="power-btn">봇 시작</button>
  </div>

  <div id="setup" class="setup-bar" hidden></div>
  <div id="err" class="err-bar" hidden></div>
  <div id="live" class="live-bar" hidden></div>
  <div id="note" class="warn-bar" hidden></div>

  <section class="tiles" aria-label="요약">
    <div class="tile"><div class="label">봇 상태</div><div class="value" id="t-run" style="font-size:19px">–</div></div>
    <div class="tile"><div class="label">주문 모드</div><div class="value" id="t-mode" style="font-size:19px">–</div></div>
    <div class="tile"><div class="label">감시 종목</div><div class="value" id="t-symbols">–</div></div>
    <div class="tile"><div class="label">보유 종목</div><div class="value" id="t-pos">–</div></div>
    <div class="tile"><div class="label">주문가능 현금</div><div class="value" id="t-cash" style="font-size:19px">–</div></div>
    <div class="tile"><div class="label">평가손익</div><div class="value" id="t-pl" style="font-size:19px">–</div></div>
    <div class="tile"><div class="label">마지막 점검</div><div class="value" id="t-last" style="font-size:17px">–</div></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="watch" aria-selected="true">감시 현황<span class="count" id="c-watch">0</span></button>
    <button class="tab" role="tab" data-tab="positions" aria-selected="false">보유<span class="count" id="c-pos">0</span></button>
    <button class="tab" role="tab" data-tab="events" aria-selected="false">체결 · 로그<span class="count" id="c-ev">0</span></button>
    <button class="tab" role="tab" data-tab="config" aria-selected="false">전략 설정</button>
    <button class="tab" role="tab" data-tab="rules" aria-selected="false">매매 규칙</button>
  </div>

  <div class="panel" id="view"></div>
  <div id="detail"></div>

  <footer>투자 판단의 참고 자료이며 수익을 보장하지 않습니다. · 데이터·주문: 토스증권 OpenAPI</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n, d = 0) => n == null || Number.isNaN(Number(n)) ? "–" :
  Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

const URL_TAB = new URLSearchParams(location.search).get("tab");
const TABS = ["watch", "positions", "events", "config", "rules"];
let STATE = null, TAB = TABS.includes(URL_TAB) ? URL_TAB : "watch", SELECTED = null;

const ACT_LABEL = {
  BUY: "매수", SELL: "전량매도", TAKE_PROFIT: "부분익절", STOP: "손절매도",
  HOLD: "대기", ERROR: "오류", NODATA: "데이터부족", SYSTEM: "시스템",
};
const tossUrl = (s) => `https://www.tossinvest.com/stocks/${encodeURIComponent(s)}`;
const tossLink = (code, text, cls = "") =>
  `<a class="toss ${cls}" href="${tossUrl(code)}" target="_blank" rel="noopener noreferrer"
      onclick="event.stopPropagation()">${text}</a>`;

/* ------------------------------------------------------------------ 상태 */
async function refresh() {
  try {
    STATE = await (await fetch("/api/bollinger/state")).json();
  } catch (e) {
    setStatus("err", "서버 연결 끊김");
    return;
  }
  $("#err").hidden = !STATE.error;
  if (STATE.error) $("#err").textContent = "봇 오류: " + STATE.error;
  paint();
}

function setStatus(kind, text) {
  $("#status").className = "badge " + kind;
  $("#status-text").textContent = text;
}

function paint() {
  const s = STATE, cfg = s.config || {};
  const configured = s.configured !== false;

  if (!configured) {
    setStatus("err", "API 키 필요");
    ["#t-run", "#t-mode", "#t-symbols", "#t-pos", "#t-cash", "#t-pl", "#t-last"]
      .forEach(id => $(id).textContent = "–");
    $("#view").innerHTML = `<div class="empty">토스증권 API 키를 등록하면 봇을 쓸 수 있습니다.</div>`;
    ["#power-btn", "#mode-btn", "#run-btn"].forEach(id => $(id).disabled = true);
    $("#live").hidden = true;
    return;
  }
  ["#power-btn", "#mode-btn", "#run-btn"].forEach(id => $(id).disabled = false);

  setStatus(s.running ? (s.live ? "err" : "live") : "", s.running
    ? (s.live ? "실주문 가동 중 ⚠" : "모의 가동 중") : "정지됨");
  $("#mode-label").textContent =
    `${cfg.interval}봉 · BB(${cfg.bb_period}, ${cfg.bb_stddev}) · RSI(${cfg.rsi_period}) `
    + `${cfg.rsi_buy}/${cfg.rsi_sell} · ${s.poll_interval}초 주기`;

  $("#t-run").innerHTML = s.running ? "가동 중" : "정지";
  $("#t-mode").innerHTML = s.live
    ? `<span class="up">실주문 ⚠</span>` : `<span class="muted">모의</span>`;
  $("#t-symbols").innerHTML = fmt((cfg.symbols || []).length) + "<small>종목</small>";
  $("#t-pos").innerHTML = fmt((s.positions || []).length) + "<small>종목</small>";
  $("#t-cash").textContent = fmt(s.cash) + "원";
  const pl = (s.equity || {})["평가손익"];
  $("#t-pl").innerHTML = pl == null ? "–" :
    `<span class="${pl >= 0 ? "up" : "down"}">${pl >= 0 ? "+" : ""}${fmt(pl)}원</span>`;
  $("#t-last").textContent = s.last_run ? s.last_run.slice(11) : "–";

  $("#c-watch").textContent = (s.decisions || []).length;
  $("#c-pos").textContent = (s.positions || []).length;
  $("#c-ev").textContent = (s.events || []).length;
  $("#power-btn").textContent = s.running ? "봇 정지" : "봇 시작";
  $("#power-btn").className = s.running ? "danger" : "primary";
  $("#mode-btn").textContent = s.live ? "모의로 전환" : "실주문으로 전환";

  $("#live").hidden = !s.live;
  if (s.live) {
    $("#live").innerHTML = `<b>⚠ 실주문 모드입니다.</b>
      <span>조건이 맞으면 <b>확인 없이 즉시 시장가 주문</b>이 나갑니다 —
      1회 한도 ${fmt(s.max_order_amount)}원 · 예수금의 ${(cfg.cash_ratio * 100).toFixed(0)}% ·
      동시 ${cfg.max_positions}종목까지.</span>`;
  }

  const notes = [];
  if (!s.trading_allowed) notes.push("서버 실거래 스위치가 꺼져 있어 <b>모의 주문만</b> 가능합니다 (설정의 '실주문 허용'과 서버 <code>TOSS_TRADING_ENABLED</code> 가 모두 필요).");
  if (!(cfg.symbols || []).length) notes.push("감시 종목이 없습니다 — <b>전략 설정</b> 탭에서 종목코드를 추가하세요.");
  if (s.running && !s.market_open) notes.push("정규장(09:00~15:30) 시간이 아닙니다 — 판정만 하고 주문은 내지 않습니다.");
  if ((s.adopted || []).length) notes.push(
    `<b>${s.adopted.join(", ")}</b> 는 봇이 매수한 물량이 아니라 <b>이미 계좌에 있던 보유분</b>입니다 — `
    + (cfg.manage_existing
       ? "<b>‘기존 보유분도 관리’ 가 켜져 있어</b> 계좌 평단 기준으로 손절·청산 규칙이 그대로 적용됩니다. 장기 보유 종목이라면 감시 목록에서 빼세요."
       : "‘기존 보유분도 관리’ 가 꺼져 있어 <b>청산하지 않습니다</b> (판정만 표시)."));
  $("#note").hidden = !notes.length;
  $("#note").innerHTML = notes.map(n => `<div>· ${n}</div>`).join("");

  renderTab();
}

/* ------------------------------------------------------------------ 탭 */
document.querySelectorAll(".tab").forEach(btn => {
  btn.setAttribute("aria-selected", String(btn.dataset.tab === TAB));
  btn.onclick = () => {
    TAB = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    renderTab();
  };
});

function renderTab() {
  if (!STATE) return;
  if (TAB === "watch") renderWatch();
  else if (TAB === "positions") renderPositions();
  else if (TAB === "events") renderEvents();
  else if (TAB === "config") renderConfig();
  else renderRules();
}

const TIPS = {
  "판정": "이번 점검에서 나온 결론. 조건이 맞으면 주문까지 이어집니다",
  "%B": "(현재가−하한선)÷(상한−하한). 0 이하면 하단 이탈(매수 조건), 1 이상이면 상단 이탈(매도 조건)",
  "RSI": "14봉 상대강도지수. 30 이하 과매도(매수 필터), 70 이상 과매수(매도 필터)",
  "하한선": "중앙선 − 2σ. 여기 이하로 내려오고 RSI 도 과매도면 매수",
  "중앙선": "20봉 이동평균. 보유 중 여기 도달 시 절반 익절(옵션)",
  "상한선": "중앙선 + 2σ. 여기 이상이고 RSI 도 과매수면 전량 청산",
  "밴드폭": "(상한−하한)÷중앙선. 좁을수록 박스권 — 이 전략에 유리합니다",
};

function table(cols, rows, rowFn, clickable) {
  if (!rows.length) return `<div class="empty">표시할 항목이 없습니다.</div>`;
  const head = cols.map(c => `<th${TIPS[c] ? ` title="${TIPS[c]}"` : ""}>${c}</th>`).join("");
  const body = rows.map((r, i) => `<tr ${clickable ? `data-i="${i}"` : ""}
      aria-selected="${SELECTED === r["종목코드"]}">${rowFn(r)}</tr>`).join("");
  return `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const actCell = (a) => `<span class="act act-${a}">${ACT_LABEL[a] || a}</span>`;

function pbGauge(v) {
  if (v == null || Number.isNaN(v)) return "–";
  const pos = Math.max(0, Math.min(1, v)) * 100;
  return `<span class="pb" title="%B ${v.toFixed(2)}"><i style="left:calc(${pos}% - 1px)"></i></span>
          <span class="muted" style="margin-left:6px">${v.toFixed(2)}</span>`;
}

function renderWatch() {
  const rows = STATE.decisions || [];
  $("#view").innerHTML = table(
    ["판정", "종목코드", "종목명", "현재가", "하한선", "중앙선", "상한선", "RSI", "%B", "밴드폭", "사유"],
    rows,
    r => r["액션"] === "ERROR" || r["액션"] === "NODATA"
      ? `<td>${actCell(r["액션"])}</td><td>${tossLink(r["종목코드"], r["종목코드"], "sym")}</td>
         <td>${r["종목명"] || ""}</td><td colspan="8" class="l muted">${r["사유"] || ""}</td>`
      : `<td>${actCell(r["액션"])}</td>
         <td>${tossLink(r["종목코드"], r["종목코드"], "sym")}</td>
         <td>${tossLink(r["종목코드"], r["종목명"] || r["종목코드"])}</td>
         <td>${fmt(r.close)}</td>
         <td class="down">${fmt(r.lower)}</td>
         <td class="muted">${fmt(r.mid)}</td>
         <td class="up">${fmt(r.upper)}</td>
         <td class="${r.rsi <= (STATE.config.rsi_buy) ? "down" : r.rsi >= STATE.config.rsi_sell ? "up" : ""}">${fmt(r.rsi, 1)}</td>
         <td>${pbGauge(r.percent_b)}</td>
         <td class="muted">${r.bandwidth == null ? "–" : (r.bandwidth * 100).toFixed(1) + "%"}</td>
         <td class="l muted">${r["사유"] || ""}${r["결과"] && r["결과"].message
             ? `<div class="muted">→ ${r["결과"].message}</div>` : ""}</td>`,
    true);
  bindRows(rows.map(r => r["종목코드"]));
}

function renderPositions() {
  const rows = STATE.positions || [];
  $("#view").innerHTML = table(
    ["종목코드", "종목명", "수량", "매수평단", "손절선", "부분익절", "진입시각", "메모"],
    rows,
    r => {
      const stop = r.entry_price * (1 - STATE.config.stop_loss_pct);
      return `<td>${tossLink(r.symbol, r.symbol, "sym")}</td>
        <td>${tossLink(r.symbol, r.name || r.symbol)}</td>
        <td>${fmt(r.quantity)}주</td>
        <td>${fmt(r.entry_price)}</td>
        <td class="down">${fmt(stop)}</td>
        <td class="muted">${r.mid_taken ? "완료" : "대기"}</td>
        <td class="muted">${(r.entered_at || "").slice(5)}</td>
        <td class="l ${r.adopted ? "up" : "muted"}">${r.adopted
          ? (STATE.config.manage_existing ? "기존 보유분 (관리 중)" : "기존 보유분 (청산 안 함)")
          : "봇 매수"}</td>`;
    },
    true);
  bindRows(rows.map(r => r.symbol));
}

function renderEvents() {
  const rows = STATE.events || [];
  $("#view").innerHTML = table(
    ["시각", "액션", "상태", "내용"],
    rows,
    r => `<td class="muted">${(r.ts || "").slice(5)}</td>
      <td>${actCell(r["액션"])}</td>
      <td class="muted">${r["상태"] || ""}</td>
      <td class="l">${r["내용"] || ""}</td>`,

function bindRows(symbols) {
  $("#view").querySelectorAll("tbody tr[data-i]").forEach(tr => {
    tr.onclick = () => selectSymbol(symbols[+tr.dataset.i]);

}

/* ------------------------------------------------- 상세 차트 (밴드 + RSI) */
async function selectSymbol(symbol) {
  if (!symbol) return;
  SELECTED = symbol;
  renderTab();
  const d = $("#detail");
  d.innerHTML = `<div class="panel chart-wrap"><div class="empty">차트 불러오는 중…</div></div>`;
  let data;
  try {
    const r = await fetch(`/api/bollinger/chart/${symbol}?count=120`);
    data = await r.json();
    if (!r.ok) throw new Error(data.detail || "조회 실패");
  } catch (e) {
    d.innerHTML = `<div class="panel chart-wrap"><div class="empty">차트를 불러오지 못했습니다 — ${e.message || e}</div></div>`;
    return;
  }
  const dec = (STATE.decisions || []).find(x => x["종목코드"] === symbol) || {};
  d.innerHTML = `<div class="panel chart-wrap">
    <div class="page-head" style="margin-bottom:10px">
      <h1 style="font-size:17px">${dec["종목명"] || symbol}
        <span class="muted">${symbol} · ${data.interval}봉</span></h1>
      <div class="spacer"></div>
      <a class="toss" href="${tossUrl(symbol)}" target="_blank" rel="noopener noreferrer">토스증권에서 열기 ↗</a>
    </div>
    <div class="chart-box" id="chart-box"></div>
    <div class="legend">
      <span><i style="background:var(--up)"></i>양봉(상승)</span>
      <span><i style="background:var(--down)"></i>음봉(하락)</span>
      <span><i style="background:var(--accent);height:2px;border-radius:0"></i>볼린저 밴드 / 중앙선</span>
      <span><i style="background:var(--text-muted);height:2px;border-radius:0"></i>RSI ${STATE.config.rsi_buy} / ${STATE.config.rsi_sell} 기준선</span>
    </div>
  </div>`;
  drawChart(data.bars);
}

function drawChart(bars) {
  const box = $("#chart-box");
  const W = 1000, H = 400, PL = 8, PR = 62, PT = 10, PB = 22;
  const PRICE_H = 250, GAP = 16, RSI_H = H - PT - PB - PRICE_H - GAP;
  const n = bars.length;
  if (!n) { box.innerHTML = `<div class="empty">봉 데이터가 없습니다.</div>`; return; }
  const iw = (W - PL - PR) / n, bw = Math.max(1.5, iw * 0.6);

  const lo = Math.min(...bars.map(b => Math.min(b.low, b.lower)));
  const hi = Math.max(...bars.map(b => Math.max(b.high, b.upper)));
  const pad = (hi - lo) * 0.06 || 1;
  const y = v => PT + PRICE_H - (v - lo + pad) / (hi - lo + pad * 2) * PRICE_H;
  const cx = i => PL + iw * (i + 0.5);
  const ry = v => PT + PRICE_H + GAP + RSI_H - (v / 100) * RSI_H;

  const grid = [];
  for (let t = 0; t <= 4; t++) {
    const val = lo - pad + (hi - lo + pad * 2) * t / 4, gy = y(val);
    grid.push(`<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${W - PR + 6}" y="${(gy + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11">${fmt(val)}</text>`);
  }

  const path = (key, yf, dash = "") => {
    const pts = bars.map((b, i) => `${cx(i).toFixed(1)},${yf(b[key]).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.3"
             stroke-dasharray="${dash}" opacity=".85"/>`;
  };
  // 밴드 사이를 옅게 채워 박스권 폭이 한눈에 보이게 한다
  const bandArea = `<polygon fill="var(--accent)" opacity=".08" points="${
    bars.map((b, i) => `${cx(i).toFixed(1)},${y(b.upper).toFixed(1)}`).join(" ")} ${
    bars.map((b, i) => `${cx(n - 1 - i).toFixed(1)},${y(bars[n - 1 - i].lower).toFixed(1)}`).join(" ")}"/>`;

  const candles = bars.map((b, i) => {
    const up = b.close >= b.open, col = up ? "var(--up)" : "var(--down)";
    const top = y(Math.max(b.open, b.close)), bot = y(Math.min(b.open, b.close));
    return `<line x1="${cx(i).toFixed(1)}" y1="${y(b.high).toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${y(b.low).toFixed(1)}" stroke="${col}" stroke-width="1.2"/>
      <rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" fill="${col}" rx="1"/>`;
  }).join("");

  const rsiLine = `<polyline points="${bars.map((b, i) => `${cx(i).toFixed(1)},${ry(b.rsi).toFixed(1)}`).join(" ")}"
      fill="none" stroke="var(--text-primary)" stroke-width="1.3" opacity=".8"/>`;
  const rsiGuide = [STATE.config.rsi_buy, 50, STATE.config.rsi_sell].map(v =>
    `<line x1="${PL}" y1="${ry(v).toFixed(1)}" x2="${W - PR}" y2="${ry(v).toFixed(1)}"
       stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="${v === 50 ? "1 4" : "4 4"}" opacity=".6"/>
     <text x="${W - PR + 6}" y="${(ry(v) + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11">${v}</text>`).join("");

  // 양 끝 라벨은 가운데 정렬하면 차트 밖으로 잘린다 — 안쪽으로 붙인다
  const xLabels = bars.map((b, i) => {
    if (i % Math.ceil(n / 8) !== 0 && i !== n - 1) return "";
    const anchor = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    return `<text x="${cx(i).toFixed(1)}" y="${H - 6}" fill="var(--text-muted)" font-size="11"
              text-anchor="${anchor}">${b.time.slice(5)}</text>`;
  }).join("");

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="최근 ${n}봉 캔들과 볼린저 밴드, 아래에 RSI">
    ${grid.join("")}${bandArea}
    ${path("upper", y)}${path("mid", y, "4 4")}${path("lower", y)}
    ${candles}
    <text x="${PL + 2}" y="${PT + PRICE_H + GAP + 6}" fill="var(--text-muted)" font-size="11">RSI</text>
    ${rsiGuide}${rsiLine}${xLabels}
  </svg>`;
}

/* ------------------------------------------------------------------ 액션 */
$("#power-btn").onclick = async () => {
  const running = STATE && STATE.running;
  if (!running && STATE && STATE.live &&
      !confirm("⚠ 실주문 모드로 봇을 시작합니다.\n\n조건이 맞으면 확인 없이 실제 시장가 주문이 나갑니다.\n계속할까요?")) return;
  const r = await fetch(`/api/bollinger/${running ? "stop" : "start"}`, { method: "POST" });
  if (!r.ok) alert((await r.json()).detail || "실패했습니다.");
  refresh();
};

$("#mode-btn").onclick = async () => {
  const want = !(STATE && STATE.live);
  if (want && !confirm(
      "⚠ 실주문 모드로 전환합니다.\n\n" +
      "이후 봇이 조건을 만족하면 확인 없이 실제 매수·매도 주문을 냅니다.\n" +
      "먼저 모의 모드로 충분히 관찰했는지 확인하세요.\n\n전환할까요?")) return;
  const r = await fetch("/api/bollinger/live", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ live: want, confirm: want ? "실행" : undefined }),
  });
  if (!r.ok) alert((await r.json()).detail || "전환하지 못했습니다.");
  refresh();
};

$("#run-btn").onclick = async () => {
  $("#run-btn").disabled = true;
  await fetch("/api/bollinger/run", { method: "POST" });
  setTimeout(() => { $("#run-btn").disabled = false; refresh(); }, 1500);
};

document.addEventListener("sessionchange", () => { SELECTED = null; $("#detail").innerHTML = ""; refresh(); });
document.addEventListener("themechange", () => { if (SELECTED) selectSymbol(SELECTED); });
refresh();
setInterval(refresh, 5000);
</script>
