<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>볼린저 밴드 반전 매매 · 왔니 주식</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33.3.2/dist/ag-grid-community.min.js"></script>
<link rel="stylesheet" href="/static/common.css">
<script src="/static/gnb.js"></script>
<script src="/static/session.js"></script>
</head>
<body class="font-sans text-sm leading-normal antialiased">
<div data-gnb="bollinger"></div>

<!-- GNB 우측으로 옮겨질 공통 컨트롤 (gnb.js 가 이동시킨다) -->
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold
             bg-s2 text-txt2 border border-line" id="status" data-gnb-action>
  <span class="w-[7px] h-[7px] rounded-full bg-txt3" id="status-dot"></span>
  <span id="status-text">연결 중…</span></span>
<button data-settings-btn title="내 토스 API 키 설정" data-gnb-action hidden>⚙ 설정</button>

<div class="max-w-page mx-auto px-5 pt-5 pb-14">
  <div class="flex flex-wrap gap-3 items-center mb-4">
    <h1 class="m-0 text-[19px] font-semibold tracking-tight">볼린저 밴드 반전 매매
      <span class="text-txt3 font-normal text-[13px] ml-2" id="mode-label"></span></h1>
    <div class="flex-1"></div>
    <button class="font-sans text-sm rounded-lg border border-line bg-s1 text-txt px-3.5 py-1.5 hover:bg-s2 disabled:opacity-50 disabled:cursor-not-allowed" id="run-btn">지금 점검</button>
    <button class="font-sans text-sm rounded-lg border border-transparent bg-bad text-white font-semibold px-3.5 py-1.5 hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed" id="mode-btn">모의 ↔ 실주문</button>
    <button class="font-sans text-sm rounded-lg border border-transparent bg-accent text-white font-semibold px-3.5 py-1.5 hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed" id="power-btn">봇 시작</button>
  </div>

  <div id="setup" hidden></div>
  <div id="err" class="tint-bad border border-bad px-3.5 py-2.5 rounded-[10px] mb-3.5 text-[13px]" hidden></div>
  <!-- 실주문 경고 배너 — 실주문 모드에서만 보인다. 색을 약하게 바꾸지 말 것. -->
  <div id="live" class="tint-bad border border-bad px-3.5 py-2.5 rounded-[10px] mb-3.5 text-[13px]
       flex flex-wrap gap-2.5 items-center" hidden></div>
  <div id="note" class="tint-warn border border-warn px-3.5 py-2.5 rounded-[10px] mb-3.5 text-[13px]" hidden></div>

  <section class="grid grid-cols-[repeat(auto-fit,minmax(150px,1fr))] gap-2.5 mb-4" aria-label="요약">
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">봇 상태</div>
      <div class="text-[19px] font-semibold tracking-tight tabular-nums" id="t-run">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">주문 모드</div>
      <div class="text-[19px] font-semibold tracking-tight tabular-nums" id="t-mode">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">감시 종목</div>
      <div class="text-[26px] font-semibold tracking-tight tabular-nums" id="t-symbols">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">보유 종목</div>
      <div class="text-[26px] font-semibold tracking-tight tabular-nums" id="t-pos">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">주문가능 현금</div>
      <div class="text-[19px] font-semibold tracking-tight tabular-nums" id="t-cash">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">평가손익</div>
      <div class="text-[19px] font-semibold tracking-tight tabular-nums" id="t-pl">–</div></div>
    <div class="bg-s1 border border-line rounded-xl px-4 py-3.5">
      <div class="text-xs text-txt3 mb-1">마지막 점검</div>
      <div class="text-[17px] font-semibold tabular-nums" id="t-last">–</div></div>
  </section>

  <div class="flex gap-1 border-b border-line mb-3.5" role="tablist">
    <button class="tab px-3.5 py-2 bg-transparent border-0 border-b-2 border-transparent rounded-none text-txt2 font-medium hover:text-txt aria-selected:text-txt aria-selected:border-accent aria-selected:font-bold" role="tab" data-tab="watch" aria-selected="true">감시 현황<span class="ml-1.5 px-1.5 py-px rounded-full bg-s2 text-[11px] text-txt2 inline-block" id="c-watch">0</span></button>
    <button class="tab px-3.5 py-2 bg-transparent border-0 border-b-2 border-transparent rounded-none text-txt2 font-medium hover:text-txt aria-selected:text-txt aria-selected:border-accent aria-selected:font-bold" role="tab" data-tab="positions" aria-selected="false">보유<span class="ml-1.5 px-1.5 py-px rounded-full bg-s2 text-[11px] text-txt2 inline-block" id="c-pos">0</span></button>
    <button class="tab px-3.5 py-2 bg-transparent border-0 border-b-2 border-transparent rounded-none text-txt2 font-medium hover:text-txt aria-selected:text-txt aria-selected:border-accent aria-selected:font-bold" role="tab" data-tab="events" aria-selected="false">체결 · 로그<span class="ml-1.5 px-1.5 py-px rounded-full bg-s2 text-[11px] text-txt2 inline-block" id="c-ev">0</span></button>
    <button class="tab px-3.5 py-2 bg-transparent border-0 border-b-2 border-transparent rounded-none text-txt2 font-medium hover:text-txt aria-selected:text-txt aria-selected:border-accent aria-selected:font-bold" role="tab" data-tab="config" aria-selected="false">전략 설정</button>
    <button class="tab px-3.5 py-2 bg-transparent border-0 border-b-2 border-transparent rounded-none text-txt2 font-medium hover:text-txt aria-selected:text-txt aria-selected:border-accent aria-selected:font-bold" role="tab" data-tab="rules" aria-selected="false">매매 규칙</button>
    <div class="flex-1"></div>
    <button class="self-center text-sm rounded-lg border border-line bg-s1 text-txt px-3 py-1 mb-1.5
            hover:bg-s2" id="add-btn" type="button">＋ 종목 추가</button>
  </div>

  <div id="view"></div>
  <div id="detail"></div>

  <footer class="mt-6 text-xs text-txt3 text-center">투자 판단의 참고 자료이며 수익을 보장하지 않습니다. · 데이터·주문: 토스증권 OpenAPI</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n, d = 0) => n == null || Number.isNaN(Number(n)) ? "–" :
  Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

const URL_TAB = new URLSearchParams(location.search).get("tab");
const TABS = ["watch", "positions", "events", "config", "rules"];
let STATE = null, TAB = TABS.includes(URL_TAB) ? URL_TAB : "watch", SELECTED = null;

const ACT_LABEL = {
  BUY: "매수", SELL: "전량매도", TAKE_PROFIT: "부분익절", STOP: "손절매도",
  HOLD: "대기", ERROR: "오류", NODATA: "데이터부족", SYSTEM: "시스템",
};
/* 액션 강조색 — 매수=적색, 매도계열=청색(한국 시장 관례), 손절은 위험색으로 도드라지게. */
const ACT_CLS = {
  BUY: "text-up font-bold", SELL: "text-down font-bold", TAKE_PROFIT: "text-down font-bold",
  STOP: "text-bad font-bold", SYSTEM: "text-accent font-bold",
  HOLD: "text-txt3", ERROR: "text-txt3", NODATA: "text-txt3",
};
const tossUrl = (s) => `https://www.tossinvest.com/stocks/${encodeURIComponent(s)}`;
/* 종목 링크는 그리드 행 클릭(상세 열기)과 겹치지 않게 stopPropagation 한다. */
const tossLink = (code, text, cls = "") =>
  `<a class="no-underline text-inherit border-b border-dotted border-txt3 hover:text-accent
      hover:border-accent ${cls}" href="${tossUrl(code)}" target="_blank" rel="noopener noreferrer"
      onclick="event.stopPropagation()">${text}</a>`;

const EMPTY = (text) =>
  `<div class="bg-s1 border border-line rounded-xl py-11 px-5 text-center text-txt3">${text}</div>`;
const CARD = "bg-s1 border border-line rounded-xl";

/* ------------------------------------------------------------------ 상태 */
async function refresh() {
  try {
    STATE = await (await fetch("/api/bollinger/state")).json();
  } catch (e) {
    setStatus("err", "서버 연결 끊김");
    return;
  }
  $("#err").hidden = !STATE.error;
  if (STATE.error) $("#err").textContent = "봇 오류: " + STATE.error;
  paint();
}

const DOT = { live: "bg-good dot-live", busy: "bg-warn dot-busy", err: "bg-bad", "": "bg-txt3" };
function setStatus(kind, text) {
  $("#status-dot").className = `w-[7px] h-[7px] rounded-full ${DOT[kind] || DOT[""]}`;
  $("#status-text").textContent = text;
}

function paint() {
  const s = STATE, cfg = s.config || {};
  const configured = s.configured !== false;

  if (!configured) {
    setStatus("err", "API 키 필요");
    ["#t-run", "#t-mode", "#t-symbols", "#t-pos", "#t-cash", "#t-pl", "#t-last"]
      .forEach(id => $(id).textContent = "–");
    dropGrid();
    $("#view").innerHTML = EMPTY("토스증권 API 키를 등록하면 봇을 쓸 수 있습니다.");
    ["#power-btn", "#mode-btn", "#run-btn"].forEach(id => $(id).disabled = true);
    $("#live").hidden = true;
    return;
  }
  ["#power-btn", "#mode-btn", "#run-btn"].forEach(id => $(id).disabled = false);

  setStatus(s.running ? (s.live ? "err" : "live") : "", s.running
    ? (s.live ? "실주문 가동 중 ⚠" : "모의 가동 중") : "정지됨");
  $("#mode-label").textContent =
    `${cfg.interval}봉 · BB(${cfg.bb_period}, ${cfg.bb_stddev}) · RSI(${cfg.rsi_period}) `
    + `${cfg.rsi_buy}/${cfg.rsi_sell} · ${s.poll_interval}초 주기`;

  $("#t-run").innerHTML = s.running ? "가동 중" : "정지";
  $("#t-mode").innerHTML = s.live
    ? `<span class="text-up font-semibold">실주문 ⚠</span>`
    : `<span class="text-txt3">모의</span>`;
  $("#t-symbols").innerHTML = fmt((cfg.symbols || []).length)
    + `<small class="text-[13px] font-medium text-txt3 ml-1">종목</small>`;
  $("#t-pos").innerHTML = fmt((s.positions || []).length)
    + `<small class="text-[13px] font-medium text-txt3 ml-1">종목</small>`;
  $("#t-cash").textContent = fmt(s.cash) + "원";
  const pl = (s.equity || {})["평가손익"];
  $("#t-pl").innerHTML = pl == null ? "–" :
    `<span class="${pl >= 0 ? "text-up" : "text-down"} font-semibold">${pl >= 0 ? "+" : ""}${fmt(pl)}원</span>`;
  $("#t-last").textContent = s.last_run ? s.last_run.slice(11) : "–";

  $("#c-watch").textContent = (s.decisions || []).length;
  $("#c-pos").textContent = (s.positions || []).length;
  $("#c-ev").textContent = (s.events || []).length;
  $("#power-btn").textContent = s.running ? "봇 정지" : "봇 시작";
  $("#power-btn").className = s.running ? UI.cls.btnDanger : UI.cls.btnPrimary;
  $("#mode-btn").textContent = s.live ? "모의로 전환" : "실주문으로 전환";
  // 실주문으로 넘어가는 버튼은 빨간색으로 위험을 알린다 (되돌리는 쪽은 평범한 버튼).
  $("#mode-btn").className = s.live ? UI.cls.btn : UI.cls.btnDanger;

  $("#live").hidden = !s.live;
  if (s.live) {
    $("#live").innerHTML = `<b>⚠ 실주문 모드입니다.</b>
      <span>조건이 맞으면 <b>확인 없이 즉시 시장가 주문</b>이 나갑니다 —
      1회 한도 ${fmt(s.max_order_amount)}원 · 예수금의 ${(cfg.cash_ratio * 100).toFixed(0)}% ·
      동시 ${cfg.max_positions}종목까지.</span>`;
  }

  const notes = [];
  if (!s.trading_allowed) notes.push("서버 실거래 스위치가 꺼져 있어 <b>모의 주문만</b> 가능합니다 (설정의 '실주문 허용'과 서버 <code class=\"bg-s2 px-1.5 py-0.5 rounded\">TOSS_TRADING_ENABLED</code> 가 모두 필요).");
  if (!(cfg.symbols || []).length) notes.push("감시 종목이 없습니다 — 오른쪽 위 <b>＋ 종목 추가</b> 버튼으로 종목코드를 넣으세요.");
  if (s.running && !s.market_open) notes.push("정규장(09:00~15:30) 시간이 아닙니다 — 판정만 하고 주문은 내지 않습니다.");
  if ((s.adopted || []).length) notes.push(
    `<b>${s.adopted.join(", ")}</b> 는 봇이 매수한 물량이 아니라 <b>이미 계좌에 있던 보유분</b>입니다 — `
    + (cfg.manage_existing
       ? "<b>‘기존 보유분도 관리’ 가 켜져 있어</b> 계좌 평단 기준으로 손절·청산 규칙이 그대로 적용됩니다. 장기 보유 종목이라면 감시 목록에서 빼세요."
       : "‘기존 보유분도 관리’ 가 꺼져 있어 <b>청산하지 않습니다</b> (판정만 표시)."));
  $("#note").hidden = !notes.length;
  $("#note").innerHTML = notes.map(n => `<div>· ${n}</div>`).join("");

  renderTab();
}

/* ------------------------------------------------------------------ 탭 */
document.querySelectorAll(".tab").forEach(btn => {
  btn.setAttribute("aria-selected", String(btn.dataset.tab === TAB));
  btn.onclick = () => {
    TAB = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    renderTab();
  };
});

function renderTab() {
  if (!STATE) return;
  if (TAB === "watch") renderWatch();
  else if (TAB === "positions") renderPositions();
  else if (TAB === "events") renderEvents();
  else if (TAB === "config") renderConfig();
  else renderRules();
}

const TIPS = {
  "판정": "이번 점검에서 나온 결론. 조건이 맞으면 주문까지 이어집니다",
  "%B": "(현재가−하한선)÷(상한−하한). 0 이하면 하단 이탈(매수 조건), 1 이상이면 상단 이탈(매도 조건)",
  "RSI": "14봉 상대강도지수. 30 이하 과매도(매수 필터), 70 이상 과매수(매도 필터)",
  "하한선": "중앙선 − 2σ. 여기 이하로 내려오고 RSI 도 과매도면 매수",
  "중앙선": "20봉 이동평균. 보유 중 여기 도달 시 절반 익절(옵션)",
  "상한선": "중앙선 + 2σ. 여기 이상이고 RSI 도 과매수면 전량 청산",
  "밴드폭": "(상한−하한)÷중앙선. 좁을수록 박스권 — 이 전략에 유리합니다",
};

/* ------------------------------------------------------- 목록 (AG Grid) */
let GRID = null, GRID_KIND = null;

function dropGrid() { if (GRID) { GRID.destroy(); GRID = null; } GRID_KIND = null; }

/** 그리드를 담을 상자. 탭을 오갈 때마다 만들고 이전 그리드는 정리한다.
 *  폴링(5초)마다 새로 만들지 않고 setGridOption("rowData") 로 갱신한다. */
function gridHost(clickable) {
  if (GRID) { GRID.destroy(); GRID = null; }
  $("#view").innerHTML = `<div id="grid" class="${clickable ? "grid-clickable " : ""}w-full h-[min(60vh,560px)]"></div>`;
  return $("#grid");
}

/* 선택된 종목 행을 표시한다 (아래 상세 차트와 짝) */
const rowSymbol = (d) => (d && (d["종목코드"] || d.symbol)) || null;
const ROW_CLASS = { "!bg-s2": (p) => !!SELECTED && rowSymbol(p.data) === SELECTED };
function repaintRows() { if (GRID) GRID.redrawRows(); }

/* ERROR·NODATA 행은 지표가 없어 사유 한 줄만 길게 보여준다 (예전 colspan 표시 유지) */
const isBad = (r) => r && (r["액션"] === "ERROR" || r["액션"] === "NODATA");

const actCol = (headerName, headerTooltip) => ({
  field: "액션", headerName, headerTooltip, minWidth: 104,
  valueFormatter: (p) => ACT_LABEL[p.value] || p.value,
  cellClass: (p) => ACT_CLS[p.value] || "text-txt3",
});
const numCol = (field, headerName, opts = {}) => ({
  field, headerName, type: "numericColumn", minWidth: 96,
  valueFormatter: (p) => fmt(p.value, opts.d || 0), ...opts,
});

/* %B 게이지 — 하단(0) 이탈이 매수, 상단(1) 이탈이 매도 */
function pbGauge(v) {
  if (v == null || Number.isNaN(v)) return "–";
  const pos = Math.max(0, Math.min(1, v)) * 100;
  return `<span class="relative inline-block align-middle w-[90px] h-[7px] rounded-full bg-s2"
            title="%B ${v.toFixed(2)}"><i class="absolute -top-0.5 w-[3px] h-[11px] rounded-sm bg-txt"
            style="left:calc(${pos}% - 1px)"></i></span>
          <span class="text-txt3 ml-1.5">${v.toFixed(2)}</span>`;
}

function renderWatch() {
  const rows = STATE.decisions || [];
  if (!rows.length) { dropGrid(); $("#view").innerHTML = EMPTY("표시할 항목이 없습니다."); return; }
  if (GRID_KIND !== "watch") {
    GRID_KIND = "watch";
    GRID = Grid.create(gridHost(true), {
      rows, rowHeight: 48, options: { rowClassRules: ROW_CLASS },
      columns: [
        actCol("판정", TIPS["판정"]),
        { field: "종목코드", minWidth: 104,
          cellRenderer: (p) => tossLink(p.value, p.value, "font-semibold") },
        { field: "종목명", minWidth: 130,
          cellRenderer: (p) => tossLink(p.data["종목코드"], p.value || p.data["종목코드"]) },
        { ...numCol("close", "현재가"),
          // 지표가 없는 행은 나머지 8칸을 합쳐 사유만 보여준다
          colSpan: (p) => isBad(p.data) ? 8 : 1,
          cellClass: (p) => isBad(p.data) ? "text-left text-txt3 whitespace-normal" : "tabular-nums",
          valueFormatter: (p) => isBad(p.data) ? (p.data["사유"] || "") : fmt(p.value) },
        { ...numCol("lower", "하한선", { headerTooltip: TIPS["하한선"] }),
          cellClass: "tabular-nums text-down font-semibold" },
        { ...numCol("mid", "중앙선", { headerTooltip: TIPS["중앙선"] }),
          cellClass: "tabular-nums text-txt3" },
        { ...numCol("upper", "상한선", { headerTooltip: TIPS["상한선"] }),
          cellClass: "tabular-nums text-up font-semibold" },
        { ...numCol("rsi", "RSI", { headerTooltip: TIPS["RSI"], d: 1, minWidth: 84 }),
          cellClass: (p) => "tabular-nums " + (p.value <= STATE.config.rsi_buy
            ? "text-down font-semibold"
            : p.value >= STATE.config.rsi_sell ? "text-up font-semibold" : "") },
        { field: "percent_b", headerName: "%B", headerTooltip: TIPS["%B"], minWidth: 150,
          cellRenderer: (p) => pbGauge(p.value) },
        { field: "bandwidth", headerName: "밴드폭", headerTooltip: TIPS["밴드폭"],
          type: "numericColumn", minWidth: 96, cellClass: "tabular-nums text-txt3",
          valueFormatter: (p) => p.value == null ? "–" : (p.value * 100).toFixed(1) + "%" },
        { field: "사유", minWidth: 220, flex: 1, sortable: false,
          cellClass: "text-left text-txt3 whitespace-normal leading-[1.35]",
          tooltipValueGetter: (p) => p.value || "",

async function selectSymbol(symbol) {
  if (!symbol) return;
  SELECTED = symbol;
  repaintRows();
  const d = $("#detail");
  d.innerHTML = `<div class="mt-3.5">${EMPTY("차트 불러오는 중…")}</div>`;
  let data;
  try {
    const r = await fetch(`/api/bollinger/chart/${symbol}?count=120`);
    data = await r.json();
    if (!r.ok) throw new Error(data.detail || "조회 실패");
  } catch (e) {
    d.innerHTML = `<div class="mt-3.5">${EMPTY(`차트를 불러오지 못했습니다 — ${e.message || e}`)}</div>`;
    return;
  }
  const dec = (STATE.decisions || []).find(x => x["종목코드"] === symbol) || {};
  const swatch = (color, extra = "") =>
    `<i class="inline-block w-2.5 h-2.5 rounded-sm mr-1.5 -mb-px ${extra}" style="background:${color}"></i>`;
  d.innerHTML = `<div class="mt-3.5 ${CARD} px-4 py-3.5">
    <div class="flex flex-wrap gap-3 items-center mb-2.5">
      <h2 class="m-0 text-[17px] font-semibold">${dec["종목명"] || symbol}
        <span class="text-txt3 font-normal text-[13px] ml-2 tabular-nums">${symbol} · ${data.interval}봉</span></h2>
      <div class="flex-1"></div>
      <a class="text-xs px-2.5 py-1 rounded-lg border border-line bg-s2 text-txt2 no-underline
                hover:border-accent hover:text-accent"
         href="${tossUrl(symbol)}" target="_blank" rel="noopener noreferrer">토스증권에서 열기 ↗</a>
    </div>
    <div class="w-full" id="chart-box"></div>
    <div class="flex flex-wrap gap-3.5 text-xs text-txt2 mt-2">
      <span>${swatch("var(--up)")}양봉(상승)</span>
      <span>${swatch("var(--down)")}음봉(하락)</span>
      <span>${swatch("var(--accent)", "!h-0.5 !rounded-none")}볼린저 밴드 / 중앙선</span>
      <span>${swatch("var(--text-muted)", "!h-0.5 !rounded-none")}RSI ${STATE.config.rsi_buy} / ${STATE.config.rsi_sell} 기준선</span>
    </div>
  </div>`;
  drawChart(data.bars);
}

function drawChart(bars) {
  const box = $("#chart-box");
  const W = 1000, H = 400, PL = 8, PR = 62, PT = 10, PB = 22;
  const PRICE_H = 250, GAP = 16, RSI_H = H - PT - PB - PRICE_H - GAP;
  const n = bars.length;
  if (!n) { box.innerHTML = EMPTY("봉 데이터가 없습니다."); return; }
  const iw = (W - PL - PR) / n, bw = Math.max(1.5, iw * 0.6);

  const lo = Math.min(...bars.map(b => Math.min(b.low, b.lower)));
  const hi = Math.max(...bars.map(b => Math.max(b.high, b.upper)));
  const pad = (hi - lo) * 0.06 || 1;
  const y = v => PT + PRICE_H - (v - lo + pad) / (hi - lo + pad * 2) * PRICE_H;
  const cx = i => PL + iw * (i + 0.5);
  const ry = v => PT + PRICE_H + GAP + RSI_H - (v / 100) * RSI_H;

  const grid = [];
  for (let t = 0; t <= 4; t++) {
    const val = lo - pad + (hi - lo + pad * 2) * t / 4, gy = y(val);
    grid.push(`<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${W - PR + 6}" y="${(gy + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11">${fmt(val)}</text>`);
  }

  const path = (key, yf, dash = "") => {
    const pts = bars.map((b, i) => `${cx(i).toFixed(1)},${yf(b[key]).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.3"
             stroke-dasharray="${dash}" opacity=".85"/>`;
  };
  // 밴드 사이를 옅게 채워 박스권 폭이 한눈에 보이게 한다
  const bandArea = `<polygon fill="var(--accent)" opacity=".08" points="${
    bars.map((b, i) => `${cx(i).toFixed(1)},${y(b.upper).toFixed(1)}`).join(" ")} ${
    bars.map((b, i) => `${cx(n - 1 - i).toFixed(1)},${y(bars[n - 1 - i].lower).toFixed(1)}`).join(" ")}"/>`;

  const candles = bars.map((b, i) => {
    const up = b.close >= b.open, col = up ? "var(--up)" : "var(--down)";
    const top = y(Math.max(b.open, b.close)), bot = y(Math.min(b.open, b.close));
    return `<line x1="${cx(i).toFixed(1)}" y1="${y(b.high).toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${y(b.low).toFixed(1)}" stroke="${col}" stroke-width="1.2"/>
      <rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" fill="${col}" rx="1"/>`;
  }).join("");

  const rsiLine = `<polyline points="${bars.map((b, i) => `${cx(i).toFixed(1)},${ry(b.rsi).toFixed(1)}`).join(" ")}"
      fill="none" stroke="var(--text-primary)" stroke-width="1.3" opacity=".8"/>`;
  const rsiGuide = [STATE.config.rsi_buy, 50, STATE.config.rsi_sell].map(v =>
    `<line x1="${PL}" y1="${ry(v).toFixed(1)}" x2="${W - PR}" y2="${ry(v).toFixed(1)}"
       stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="${v === 50 ? "1 4" : "4 4"}" opacity=".6"/>
     <text x="${W - PR + 6}" y="${(ry(v) + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11">${v}</text>`).join("");

  // 양 끝 라벨은 가운데 정렬하면 차트 밖으로 잘린다 — 안쪽으로 붙인다
  const xLabels = bars.map((b, i) => {
    if (i % Math.ceil(n / 8) !== 0 && i !== n - 1) return "";
    const anchor = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    return `<text x="${cx(i).toFixed(1)}" y="${H - 6}" fill="var(--text-muted)" font-size="11"
              text-anchor="${anchor}">${b.time.slice(5)}</text>`;
  }).join("");

  box.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="최근 ${n}봉 캔들과 볼린저 밴드, 아래에 RSI">
    ${grid.join("")}${bandArea}
    ${path("upper", y)}${path("mid", y, "4 4")}${path("lower", y)}
    ${candles}
    <text x="${PL + 2}" y="${PT + PRICE_H + GAP + 6}" fill="var(--text-muted)" font-size="11">RSI</text>
    ${rsiGuide}${rsiLine}${xLabels}
  </svg>`;
}

/* ------------------------------------------------------------------ 액션 */
$("#power-btn").onclick = async () => {
  const running = STATE && STATE.running;
  if (!running && STATE && STATE.live &&
      !confirm("⚠ 실주문 모드로 봇을 시작합니다.\n\n조건이 맞으면 확인 없이 실제 시장가 주문이 나갑니다.\n계속할까요?")) return;
  const r = await fetch(`/api/bollinger/${running ? "stop" : "start"}`, { method: "POST" });
  if (!r.ok) alert((await r.json()).detail || "실패했습니다.");
  refresh();
};

$("#mode-btn").onclick = async () => {
  const want = !(STATE && STATE.live);
  if (want && !confirm(
      "⚠ 실주문 모드로 전환합니다.\n\n" +
      "이후 봇이 조건을 만족하면 확인 없이 실제 매수·매도 주문을 냅니다.\n" +
      "먼저 모의 모드로 충분히 관찰했는지 확인하세요.\n\n전환할까요?")) return;
  const r = await fetch("/api/bollinger/live", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ live: want, confirm: want ? "실행" : undefined }),
  });
  if (!r.ok) alert((await r.json()).detail || "전환하지 못했습니다.");
  refresh();
};

$("#run-btn").onclick = async () => {
  $("#run-btn").disabled = true;
  await fetch("/api/bollinger/run", { method: "POST" });
  setTimeout(() => { $("#run-btn").disabled = false; refresh(); }, 1500);
};

/* ------------------------------------------------- 종목 추가 모달 */
/* 감시 목록 편집은 전략 설정 폼에서 떼어내 이 창으로 모았다. 추가는 서버에서 합치는
   /symbols 를 쓰고(다른 설정을 덮어쓰지 않는다), 삭제는 목록 전체를 /config 로 보낸다. */
const ADD_MODAL = `<div class="${UI.cls.modalBack}" id="add-modal" hidden role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="${UI.cls.modal}">
    <h2 class="text-base font-semibold m-0 mb-1" id="add-title">감시 종목 추가</h2>
    <p class="text-[12.5px] text-txt3 mt-0 mb-3.5">국내 주식 6자리 코드만 지원합니다.
      쉼표나 공백으로 여러 개를 한 번에 넣을 수 있습니다. 종목이 많을수록 한 주기가 길어집니다.</p>

    <label class="${UI.cls.label}" for="a-symbols">종목코드</label>
    <div class="flex gap-2">
      <input class="${UI.cls.input}" type="text" id="a-symbols" autocomplete="off" spellcheck="false"
             placeholder="005930, 000660">
      <button class="${UI.cls.btnPrimary} shrink-0" id="a-add" type="button">추가</button>
    </div>
    <div class="text-[12.5px] mt-2.5" id="a-msg"></div>

    <fieldset class="${UI.cls.fieldset} mt-3.5 mb-0">
      <legend class="${UI.cls.legend}">현재 감시 목록</legend>
      <div class="flex flex-wrap gap-1.5" id="a-list"></div>
    </fieldset>

    <div class="flex justify-end mt-3.5">
      <button class="${UI.cls.btn}" id="a-close" type="button">닫기</button>
    </div>
  </div>
</div>`;
document.body.insertAdjacentHTML("beforeend", ADD_MODAL);

const A_MSG = { bad: "text-[12.5px] mt-2.5 text-bad", ok: "text-[12.5px] mt-2.5 text-good", "": "text-[12.5px] mt-2.5" };
const addMsg = (kind, text) => { const m = $("#a-msg"); m.className = A_MSG[kind]; m.innerHTML = text; };

function renderAddList() {
  const syms = (STATE && STATE.config && STATE.config.symbols) || [];
  $("#a-list").innerHTML = syms.length
    ? syms.map(sym => `<span class="inline-flex items-center gap-1.5 text-[12.5px] tabular-nums
         bg-s2 border border-line rounded-full pl-2.5 pr-1 py-0.5">${sym}
         <button class="border-0 bg-transparent text-txt3 hover:text-bad cursor-pointer px-1 leading-none"
           data-del="${sym}" type="button" aria-label="${sym} 제거">×</button></span>`).join("")
    : `<span class="text-[12.5px] text-txt3">아직 없습니다.</span>`;
  $("#a-list").querySelectorAll("[data-del]").forEach(b => { b.onclick = () => removeSymbol(b.dataset.del); });
}

function openAddModal() {
  $("#add-modal").hidden = false;
  addMsg("", "");
  $("#a-symbols").value = "";
  renderAddList();
  $("#a-symbols").focus();
}
const closeAddModal = () => { $("#add-modal").hidden = true; };

async function addSymbols() {
  const codes = [...new Set(($("#a-symbols").value.match(/\d{6}/g) || []))];
  if (!codes.length) { addMsg("bad", "6자리 종목코드를 입력하세요."); return; }
  $("#a-add").disabled = true;
  addMsg("", "추가하는 중…");
  const added = [], dup = [], failed = [];
  try {
    for (const symbol of codes) {
      const r = await fetch("/api/bollinger/symbols", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ symbol }),
      });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) failed.push(`${symbol}(${out.detail || "실패"})`);
      else if (out.added) added.push(symbol);
      else dup.push(symbol);
    }
  } catch (e) {
    $("#a-add").disabled = false;
    addMsg("bad", "서버에 연결하지 못했습니다: " + e);
    return;
  }
  $("#a-add").disabled = false;
  await refresh();
  renderAddList();
  $("#a-symbols").value = "";
  const parts = [];
  if (added.length) parts.push(`<b>${added.join(", ")}</b> 추가`);
  if (dup.length) parts.push(`${dup.join(", ")} 는 이미 있습니다`);
  if (failed.length) parts.push(`${failed.join(", ")}`);
  addMsg(failed.length ? "bad" : "ok", parts.join(" · "));
}

async function removeSymbol(symbol) {
  const rest = ((STATE.config || {}).symbols || []).filter(s => s !== symbol);
  addMsg("", "제거하는 중…");
  try {
    const r = await fetch("/api/bollinger/config", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ symbols: rest }),
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { addMsg("bad", out.detail || "제거 실패"); return; }
    await refresh();
    renderAddList();
    addMsg("ok", `<b>${symbol}</b> 를 감시 목록에서 뺐습니다.`);
  } catch (e) {
    addMsg("bad", "서버에 연결하지 못했습니다: " + e);
  }
}

$("#add-btn").onclick = openAddModal;
$("#a-add").onclick = addSymbols;
$("#a-close").onclick = closeAddModal;
$("#a-symbols").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); addSymbols(); } };
$("#add-modal").onclick = (e) => { if (e.target.id === "add-modal") closeAddModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#add-modal").hidden) closeAddModal(); });

document.addEventListener("sessionchange", () => { SELECTED = null; $("#detail").innerHTML = ""; refresh(); });
document.addEventListener("themechange", () => { if (SELECTED) selectSymbol(SELECTED); });
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
