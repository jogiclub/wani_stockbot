<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 왔니 주식</title>
  <link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/common.css">
  <script src="/static/gnb.js"></script>  <!-- <html data-bs-theme> 를 페인트 전에 정한다 (로그인 화면엔 GNB 없음) -->
</head>
<body>
  <div class="min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">
    <form class="card shadow" style="width:min(380px,100%)" id="login-form">
      <div class="card-body px-4 pt-4 pb-3">
        <div class="d-flex align-items-center gap-2 fs-5 fw-bold mb-1">
          <span class="d-inline-flex align-items-center justify-content-center rounded-2 bg-accent text-white"
                style="width:26px;height:26px;font-size:14px">왔</span>왔니 주식</div>
        <p class="small text-body-tertiary mb-3" id="sub">자동 매매 전략 대시보드입니다. 계정으로 로그인하세요.</p>

        <ul class="nav nav-pills nav-fill gap-1 mb-3" id="tabs" hidden>
          <li class="nav-item"><button type="button" data-mode="login" class="nav-link active w-100">로그인</button></li>
          <li class="nav-item"><button type="button" data-mode="signup" class="nav-link w-100">회원가입</button></li>
        </ul>

        <div class="mb-3">
          <label class="form-label small text-body-secondary mb-1" for="u">아이디</label>
          <input class="form-control" type="text" id="u" name="username" autocomplete="username" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small text-body-secondary mb-1" for="p">비밀번호</label>
          <input class="form-control" type="password" id="p" name="password" autocomplete="current-password">
        </div>
        <div class="mb-3" data-signup hidden>
          <label class="form-label small text-body-secondary mb-1" for="p2">비밀번호 확인</label>
          <input class="form-control" type="password" id="p2" autocomplete="new-password">
          <div class="form-text">8자 이상. 아이디는 영문·숫자 3~32자.</div>
        </div>
        <div class="mb-3" data-signup data-code hidden>
          <label class="form-label small text-body-secondary mb-1" for="code">초대 코드</label>
          <input class="form-control" type="text" id="code" autocomplete="off">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-100 fw-semibold">로그인</button>
        <div class="small mt-3 text-body-secondary" style="min-height:18px" id="msg"></div>
      </div>
    </form>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let mode = "login", codeRequired = false;

    // 회원가입은 서버가 허용할 때만 보인다 (APP_SIGNUP).
    fetch("/api/auth/options").then(r => r.json()).then(o => {
      if (!o.signup) return;
      codeRequired = o.signup_code_required;
      $("#tabs").hidden = false;
      if (new URLSearchParams(location.search).get("signup") !== null) setMode("signup");
    }).catch(() => {});

    function setMode(m) {
      mode = m;
      document.querySelectorAll("#tabs button").forEach(b => {
        const on = b.dataset.mode === m;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", String(on));
      });
      document.querySelectorAll("[data-signup]").forEach(el => {
        el.hidden = m !== "signup" || (el.hasAttribute("data-code") && !codeRequired);
      });
      $("#p").autocomplete = m === "signup" ? "new-password" : "current-password";
      $("#login-btn").textContent = m === "signup" ? "가입하고 시작" : "로그인";
      $("#sub").textContent = m === "signup"
        ? "가입 후 상단 🔑 API 키 설정에서 본인 토스증권 API 키를 넣으면 나만의 스캔·자동매매가 시작됩니다."
        : "자동 매매 전략 대시보드입니다. 계정으로 로그인하세요.";
      $("#msg").textContent = "";
    }
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

    $("#login-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = $("#login-btn"), msg = $("#msg");
      const bad = (t) => { msg.className = "small mt-3 text-bad"; msg.textContent = t; };
      const body = { username: $("#u").value.trim(), password: $("#p").value };
      if (mode === "signup") {
        if (body.password !== $("#p2").value) return bad("비밀번호 확인이 일치하지 않습니다.");
        body.code = $("#code").value.trim();
      }
      msg.className = "small mt-3 text-body-secondary"; msg.textContent = "확인 중…";
      btn.disabled = true;
      try {
        const r = await fetch(mode === "signup" ? "/api/signup" : "/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const out = await r.json();
        if (!r.ok) return bad(out.detail || (mode === "signup" ? "가입 실패" : "로그인 실패"));
        const next = new URLSearchParams(location.search).get("next");
        location.href = next && next.startsWith("/") ? next : "/";
      } catch (e) {
        bad("서버에 연결하지 못했습니다: " + e);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
