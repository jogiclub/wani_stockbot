<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세력 추정 매매법 스크리너 · 왔니 주식</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/common.css">
<script src="/static/gnb.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33.3.2/dist/ag-grid-community.min.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/session.js"></script>
<script src="/static/offcanvas.js"></script>
<script src="/static/stockmenu.js"></script>
<style>
  /* 가이드 탭의 표·본문 (Bootstrap 에 없는 정렬 규칙만) */
  .gtbl { --bs-table-bg: transparent; }
  .gtbl th, .gtbl td { text-align: right; }
  .gtbl th:first-child, .gtbl td:first-child, .gtbl .tl { text-align: left; }
  .guide { line-height: 1.75; }
  .guide p { margin-bottom: .6rem; color: var(--text-secondary); }
  .guide code { background: var(--surface-2); padding: .1rem .4rem; border-radius: .25rem; }
  .guide ul { padding-left: 1.25rem; }
  .guide li { margin-bottom: .25rem; }
  .guide > h3:first-child { margin-top: 0 !important; }
</style>
</head>
<body>
<div data-gnb="screener"></div>

<!-- GNB 우측으로 옮겨질 공통 컨트롤 (gnb.js 가 이동시킨다) -->
<span class="badge rounded-pill d-inline-flex align-items-center gap-1 bg-s2 text-body-secondary border border-line fw-semibold" id="status" data-gnb-action>
  <span class="d-inline-block rounded-circle bg-secondary" style="width:7px;height:7px" id="status-dot"></span>
  <span id="status-text">연결 중…</span></span>
<button data-settings-btn data-gnb-action hidden>⚙ 설정</button>

<div class="page-wrap mx-auto px-3 pt-4 pb-5">
  <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
    <h1 class="m-0 fs-4 fw-semibold">세력 추정 매매법 스크리너
      <span class="text-body-tertiary fw-normal small ms-2" id="mode-label"></span></h1>
    <div class="flex-grow-1"></div>
    <button class="btn btn-sm btn-primary fw-semibold" id="scan-btn">지금 스캔</button>
  </div>

  <div id="setup" hidden></div>
  <div id="err" class="alert tint-bad border border-bad py-2 px-3 mb-3 small" hidden></div>
  <div id="blocked" class="alert tint-warn border border-warn py-2 px-3 mb-3 small" hidden></div>
  <div id="regime" hidden></div>

  <section class="row g-2 mb-3" aria-label="요약">
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">매수 시그널</div>
      <div class="fs-3 fw-semibold tnum" id="t-signals">–</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">돌파 대기</div>
      <div class="fs-3 fw-semibold tnum" id="t-watch">–</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">판정 종목</div>
      <div class="fs-3 fw-semibold tnum" id="t-scanned">–</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">필터 제외</div>
      <div class="fs-3 fw-semibold tnum" id="t-skipped">–</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">마지막 스캔</div>
      <div class="fs-5 fw-semibold tnum" id="t-last">–</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="card card-body px-3 py-3">
      <div class="small text-body-tertiary mb-1">다음 스캔</div>
      <div class="fs-5 fw-semibold tnum" id="t-next">–</div></div></div>
  </section>

  <div class="nav nav-tabs mb-3" role="tablist" id="tabs">
    <button class="nav-link tab active" role="tab" data-tab="signals" aria-selected="true">매수 시그널<span class="badge rounded-pill bg-s2 text-body-secondary ms-1" id="c-signals">0</span></button>
    <button class="nav-link tab" role="tab" data-tab="watch" aria-selected="false">돌파 대기<span class="badge rounded-pill bg-s2 text-body-secondary ms-1" id="c-watch">0</span></button>
    <button class="nav-link tab" role="tab" data-tab="config" aria-selected="false">전략 설정</button>
    <button class="nav-link tab" role="tab" data-tab="guide" aria-selected="false">가이드 · 근거</button>
  </div>

  <div id="view"></div>
  <div id="detail" data-oc="bottom"></div>

  <footer class="mt-4 small text-body-tertiary text-center">투자 판단의 참고 자료이며 수익을 보장하지 않습니다. · 데이터: 토스증권 OpenAPI</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (n, d = 0) => n == null || Number.isNaN(n) ? "–" :
  Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

// ?tab=guide 처럼 URL 로 탭을 바로 열 수 있다 (딥링크·북마크용)
const URL_TAB = new URLSearchParams(location.search).get("tab");
let STATE = null, TAB = ["signals", "watch", "config", "guide"].includes(URL_TAB) ? URL_TAB : "signals",
    SELECTED = null, CFG = null, NEXT_AT = null;

/* 테마 토글은 공통 GNB(gnb.js)가 담당한다. 여기서는 색이 바뀌면
   인라인 SVG 차트를 다시 그려 주기만 한다. */
document.addEventListener("themechange", () => { if (SELECTED) renderDetail(SELECTED); });

/* ------------------------------------------------------------------ 데이터 */
async function refresh() {
  try {
    const r = await fetch("/api/state");
    STATE = await r.json();
    $("#err").hidden = !STATE.error;
    if (STATE.error) $("#err").textContent = "스캔 오류: " + STATE.error;
    const g = STATE.regime || {};
    const rg = $("#regime");
    rg.hidden = !g.available;
    if (g.available) {
      rg.className = "d-flex flex-wrap align-items-center gap-2 px-3 py-2 rounded-3 mb-3 small border "
        + (g.on ? "tint-good border-good" : "tint-bad border-bad");
      rg.innerHTML = `<b>시장 국면 ${g.on ? "우호 ✅" : "비우호 ⚠"}</b>
        <span>${g.symbol} ${fmt(g.close, 2)} / ${g.ma}일선 ${fmt(g.ma_value, 2)}
        (${g.gap_pct > 0 ? "+" : ""}${g.gap_pct}%)</span>
        <span class="text-body-tertiary">${g.on
          ? "백테스트상 이 국면의 시그널 평균 +0.173R"
          : "이 국면의 시그널은 백테스트 평균 −0.117R — 신규 진입 자제 권장"}</span>`;
    }
    const blocked = STATE.blocked || [];
    $("#blocked").hidden = !blocked.length;
    if (blocked.length) {
      $("#blocked").innerHTML = `<b>⚠ 매수 유의 종목 ${blocked.length}건 제외</b>` +
        blocked.map(b => `${b["종목명"]}(${b["종목코드"]}) — ${b["사유"]}`).join(" · ");
    }
    if (STATE.finished_at) NEXT_AT = Date.now() + STATE.interval * 1000;
    paint();
  } catch (e) {
    setStatus("err", "서버 연결 끊김");
  }
}

const DOT = { live: "bg-good dot-live", busy: "bg-warning dot-busy", err: "bg-bad", "": "bg-secondary" };
function setStatus(kind, text) {
  $("#status-dot").className = `d-inline-block rounded-circle ${DOT[kind] || DOT[""]}`;
  $("#status-text").textContent = text;
}

function paint() {
  const s = STATE;
  if (s.configured === false) {          // 아직 쓸 수 있는 자격증명이 없다
    setStatus("err", "API 키 필요");
    $("#mode-label").textContent = "";
    ["#t-signals", "#t-watch", "#t-scanned", "#t-skipped", "#t-last", "#t-next"]
      .forEach(id => $(id).textContent = "–");
    $("#c-signals").textContent = "0"; $("#c-watch").textContent = "0";
    $("#scan-btn").disabled = false;
    $("#view").innerHTML = EMPTY("토스증권 API 키를 등록하면 스캔이 시작됩니다.");
    $("#detail").innerHTML = "";
    return;
  }
  $("#setup").hidden = true;
  setStatus(s.running ? "busy" : s.error ? "err" : "live",
            s.running ? "스캔 중…" : s.error ? "오류" : "감시 중");
  $("#mode-label").textContent =
    `${s.top ? "거래대금 상위 " + s.top + "종목" : "전체 유니버스"} · ${s.interval}초 주기 · `
    + `${s.live ? "장중 실시간" : "일봉 종가"} 기준`;
  $("#t-signals").innerHTML = fmt(s.signals.length) + "<small>건</small>";
  $("#t-watch").innerHTML = fmt(s.watch.length) + "<small>건</small>";
  $("#t-scanned").innerHTML = fmt(s.scanned) + "<small>종목</small>";
  $("#t-skipped").innerHTML = fmt(s.skipped) + "<small>종목</small>";
  $("#t-last").textContent = s.finished_at ? s.finished_at.slice(11) : "–";
  $("#c-signals").textContent = s.signals.length;
  $("#c-watch").textContent = s.watch.length;
  $("#scan-btn").disabled = s.running;
  renderTab();
  // 첫 결과가 오면 1위 종목을 자동으로 펼쳐 차트를 바로 보여준다.
  if (!SELECTED && s.signals.length && TAB === "signals") selectSignal(s.signals[0]);
}

setInterval(() => {
  if (!NEXT_AT || !STATE) return;
  const left = Math.max(0, Math.round((NEXT_AT - Date.now()) / 1000));
  $("#t-next").textContent = STATE.running ? "진행 중" : `${left}초`;
}, 1000);

/* ------------------------------------------------------------------ 탭 */
document.querySelectorAll(".tab").forEach(btn => {
  btn.setAttribute("aria-selected", String(btn.dataset.tab === TAB));
  btn.classList.toggle("active", btn.dataset.tab === TAB);
  btn.onclick = () => {
    TAB = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => {
      b.setAttribute("aria-selected", String(b === btn));
      b.classList.toggle("active", b === btn);
    });
    renderTab();
  };
});

function renderTab() {
  if (!STATE) return;
  if (TAB === "signals") renderSignals();
  else if (TAB === "watch") renderWatch();
  else if (TAB === "guide") renderGuide();
  else renderConfig();
}

const tossUrl = (symbol) => `https://www.tossinvest.com/stocks/${encodeURIComponent(symbol)}`;

/* 종목코드·종목명 셀은 StockMenu.link 로 만든다. 누르면 종목 메뉴가 뜨고,
   행 클릭(상세 열기)은 StockMenu.fromEvent 가 true 면 건너뛴다. */


const TIPS = {
  "점수": "6개 요인을 백테스트 실측 성과로 채점한 100점 만점 점수. 75점이 실전 컷오프입니다.",
  "기준봉일": "세력 매집으로 추정되는 대량거래 윗꼬리 캔들이 발생한 날",
  "윗꼬리": "(고가 − max(시가,종가)) ÷ (고가 − 저가). 위에서 물량을 받아낸 정도. 55~65%가 실측 최상",
  "기준봉 거래량": "기준봉 거래량 ÷ 직전 20일 평균 거래량. 50~100배가 실측 최상",
  "조정": "기준봉 이후 경과 영업일. 2일이 실측 최상, 길수록 나빠집니다",
  "전일고가": "돌파 기준선. 이 가격을 거래량과 함께 넘는 순간이 매수 시점",
  "현재가": "현재가가 매수가보다 크게 높으면 이미 떠난 자리 — 추격 금지",
  "거래량 증가": "당일 거래량 ÷ 전일 거래량 − 1",
  "매수가": "전일 고가 = 돌파 확인 가격",
  "손절가": "기준봉 저가. 이 값이 깨지면 매집 논리가 무너진 것 — 예외 없이 정리",
  "손절폭": "(매수가 − 손절가) ÷ 매수가. 8% 이하가 실측 최상, 18% 초과는 손실 구간",
  "감시 돌파가(전일고가)": "이 가격을 거래량과 함께 넘으면 매수 시그널로 전환됩니다",
  "기준봉 저가(손절)": "진입 시 적용될 손절가",
  "조정 거래량비": "조정 구간 평균 거래량 ÷ 기준봉 거래량. 0.10~0.20이 실측 최상",
  "경과": "기준봉 이후 경과 영업일",
};

const EMPTY = (text) =>
  `<div class="card card-body py-5 px-4 text-center text-body-tertiary">${text}</div>`;

/* 등급 배지 색 — A+·A 는 양호, B 는 관망, C·D 는 경고 */
const GRADE_BG = { "A+": "bg-good", "A": "bg-good", "B": "bg-accent",
                   "C": "bg-warning text-dark", "D": "bg-bad" };
const gradeBadge = (grade) =>
  `<span class="badge fw-bold text-white ${GRADE_BG[grade] || "bg-secondary"}">${grade}</span>`;
const scoreBar = (pct) =>
  `<div class="rounded-1 bg-s2 overflow-hidden" style="height:5px;min-width:74px">
     <i class="d-block h-100 bg-accent" style="width:${pct}%"></i></div>`;

function scoreCell(r) {
  if (r["점수"] == null) return "–";
  return `<div class="lh-sm pt-1">
      <div class="d-flex align-items-baseline gap-1 tnum">
        <b class="fs-5 fw-bold">${r["점수"]}</b>${gradeBadge(r["등급"])}</div>
      ${scoreBar(r["점수"])}</div>`;
}

/* ------------------------------------------------------- 목록 (AG Grid) */
let GRID = null, GRID_KIND = null, GRID_ROWS = [];

/** 그리드를 담을 상자. 탭을 오갈 때마다 만들고 이전 그리드는 정리한다. */
function gridHost() {
  if (GRID) { GRID.destroy(); GRID = null; }
  $("#view").innerHTML = `<div id="grid" class="grid-clickable w-100" style="height:min(60vh,560px)"></div>`;
  return $("#grid");
}

/* 선택된 행을 표시한다 (상세 패널과 짝) */
const ROW_CLASS = { "bg-s2": (p) => !!SELECTED && p.data && SELECTED["종목코드"] === p.data["종목코드"] };

const stockCol = (field, cls = "") => ({
  field, minWidth: 110,
  cellRenderer: (p) => StockMenu.link(p.data, p.value, cls),
});
const numCol = (field, opts = {}) => ({
  field, type: "numericColumn", minWidth: 96,
  valueFormatter: (p) => fmt(p.value, opts.d || 0), ...opts,
});

function renderSignals() {
  const rows = STATE.signals;
  GRID_ROWS = rows;
  if (!rows.length) { GRID_KIND = null; $("#view").innerHTML = EMPTY("매수 시그널이 없습니다."); return; }
  if (GRID_KIND !== "signals") {
    GRID_KIND = "signals";
    GRID = Grid.create(gridHost(), {
      rows, rowHeight: 46, options: { rowClassRules: ROW_CLASS },
      columns: [
        { field: "점수", headerTooltip: TIPS["점수"], minWidth: 132, sort: "desc",
          cellRenderer: (p) => scoreCell(p.data) },
        { ...stockCol("종목코드", "fw-semibold"), headerName: "종목코드" },
        { field: "종목명", minWidth: 140, cellRenderer: (p) =>
            StockMenu.link(p.data, p.value) + (p.data["유의사항"] || [])
              .map(w => `<span class="badge rounded-pill tint-warn text-body ms-1">${w}</span>`).join("") },
        { field: "기준봉일", headerTooltip: TIPS["기준봉일"], minWidth: 100,
          cellClass: "text-body-tertiary tnum", valueFormatter: (p) => p.value.slice(5) },
        { field: "기준봉_윗꼬리%", headerName: "윗꼬리", headerTooltip: TIPS["윗꼬리"],
          type: "numericColumn", minWidth: 92, valueFormatter: (p) => p.value + "%" },
        { field: "기준봉_거래량배수", headerName: "기준봉 거래량", headerTooltip: TIPS["기준봉 거래량"],
          type: "numericColumn", minWidth: 118, valueFormatter: (p) => "×" + p.value },
        { field: "조정일수", headerName: "조정", headerTooltip: TIPS["조정"], type: "numericColumn",
          minWidth: 84, cellClass: "text-body-tertiary tnum", valueFormatter: (p) => p.value + "일" },
        numCol("전일고가", { headerTooltip: TIPS["전일고가"] }),
        { ...numCol("현재가", { headerTooltip: TIPS["현재가"] }),
          cellClass: (p) => "tnum fw-semibold "
            + (p.data["현재가"] >= p.data["전일고가"] ? "text-up" : "text-down") },
        { field: "거래량증가율%", headerName: "거래량 증가", headerTooltip: TIPS["거래량 증가"],
          type: "numericColumn", minWidth: 110, cellClass: "tnum text-up fw-semibold",
          valueFormatter: (p) => "+" + fmt(p.value) + "%" },
        numCol("매수가", { headerTooltip: TIPS["매수가"] }),
        { ...numCol("손절가", { headerTooltip: TIPS["손절가"] }),
          cellClass: "tnum text-down fw-semibold" },
        { field: "손절폭%", headerName: "손절폭", headerTooltip: TIPS["손절폭"], type: "numericColumn",
          minWidth: 92, cellClass: "tnum text-body-tertiary", valueFormatter: (p) => p.value + "%" },
      ],
      onRow: (data, ev) => {
        if (!StockMenu.fromEvent(ev, data["종목코드"], data["종목명"])) selectSignal(data);
      },
    });
  } else {
    GRID.setGridOption("rowData", rows);
  }
}

function renderWatch() {
  const rows = STATE.watch;
  GRID_ROWS = rows;
  if (!rows.length) { GRID_KIND = null; $("#view").innerHTML = EMPTY("돌파를 기다리는 종목이 없습니다."); return; }
  if (GRID_KIND !== "watch") {
    GRID_KIND = "watch";
    GRID = Grid.create(gridHost(), {
      rows, options: { rowClassRules: ROW_CLASS },
      columns: [
        { ...stockCol("종목코드", "fw-semibold"), headerName: "종목코드" },
        stockCol("종목명"),
        { field: "기준봉일", headerTooltip: TIPS["기준봉일"], minWidth: 100,
          cellClass: "text-body-tertiary tnum", valueFormatter: (p) => p.value.slice(5) },
        { field: "경과일", headerName: "경과", headerTooltip: TIPS["경과"], type: "numericColumn",
          minWidth: 88, cellClass: "text-body-tertiary tnum", valueFormatter: (p) => p.value + "일" },
        { ...numCol("감시_돌파가(전일고가)", { headerName: "감시 돌파가(전일고가)", minWidth: 168,
            headerTooltip: TIPS["감시 돌파가(전일고가)"] }), cellClass: "tnum text-up fw-semibold" },
        { ...numCol("기준봉저가(손절)", { headerName: "기준봉 저가(손절)", minWidth: 148,
            headerTooltip: TIPS["기준봉 저가(손절)"] }), cellClass: "tnum text-down fw-semibold" },
        { field: "조정거래량비", headerTooltip: TIPS["조정 거래량비"], type: "numericColumn", minWidth: 118 },
      ],
      onRow: (data, ev) => {
        if (!StockMenu.fromEvent(ev, data["종목코드"], data["종목명"])) selectWatch(data);
      },
    });
  } else {
    GRID.setGridOption("rowData", rows);
  }
}

const ENTRY_CUTOFF = 75;

/* --------------------------------------------------- 포지션 사이징 계산기 */
function posCalc(r) {
  const risk = r["매수가"] - r["손절가"];
  if (!(risk > 0)) return "";
  let bal = 10000000, pct = 1;
  try {
    bal = Number(localStorage.getItem("balance")) || bal;
    pct = Number(localStorage.getItem("riskPct")) || pct;
  } catch (e) {}
  const FIELD = UI.cls.input;
  return `<div class="bg-s2 rounded-3 px-3 py-3 mt-3">
    <div class="d-flex flex-wrap gap-3 align-items-end">
      <div><label class="${UI.cls.label}">계좌 잔고 (원)</label>
        <input class="${FIELD}" style="width:150px" id="pc-bal" type="number" step="1000000" value="${bal}"></div>
      <div><label class="${UI.cls.label}">1회 허용 손실</label>
        <select class="form-select form-select-sm tnum" style="width:150px" id="pc-pct">${[0.5, 1, 1.5, 2].map(v =>
          `<option value="${v}" ${v === pct ? "selected" : ""}>${v}%</option>`).join("")}</select></div>
      <div class="small text-body-tertiary pb-1">투입금액 = (잔고 × 허용 손실) ÷ 손절폭 ${r["손절폭%"]}%</div>
    </div>
    <div class="row g-2 mt-2" id="pc-out"></div>
    <div class="d-flex flex-wrap align-items-center gap-2 mt-3 pt-3 border-top">
      <button class="${UI.cls.btn}" id="od-dry">모의 주문 확인</button>
      <button class="${UI.cls.btnDanger}" id="od-live">토스 매수 주문</button>
      <span class="small text-body-tertiary" id="od-mode"></span>
    </div>
    <div id="od-result"></div>
  </div>`;
}

function bindPosCalc(r) {
  const bal = $("#pc-bal"), pct = $("#pc-pct"), out = $("#pc-out");
  if (!bal || !out) return;
  const calc = () => {
    const b = Number(bal.value) || 0, p = Number(pct.value) || 1;
    const loss = b * p / 100;
    const riskPct = (r["매수가"] - r["손절가"]) / r["매수가"];
    const amount = riskPct > 0 ? loss / riskPct : 0;
    const shares = Math.floor(amount / r["매수가"]);
    const invested = shares * r["매수가"];
    const t = (r["목표가"] || [])[0];
    const OUT = "d-block fs-5 fw-semibold tnum";
    const cell = (lab, cls, v) => `<div class="col-6 col-sm-4 col-md"><div class="small text-body-tertiary">${lab}<strong class="${OUT} ${cls}">${v}</strong></div></div>`;
    out.innerHTML =
      cell("매수 수량", "text-body", `${fmt(shares)}주`) +
      cell("투입 금액", "text-body", `${fmt(invested)}원`) +
      cell("손절 시 손실", "text-down", `−${fmt(shares * (r["매수가"] - r["손절가"]))}원`) +
      cell("1R 도달 시", "text-up", `+${fmt(t ? shares * (t - r["매수가"]) : 0)}원`) +
      cell("계좌 대비 비중", "text-body", `${b ? (invested / b * 100).toFixed(1) : 0}%`);
    try {
      localStorage.setItem("balance", String(b));
      localStorage.setItem("riskPct", String(p));
    } catch (e) {}
    return shares;
  };
  let shares = 0;
  const recalc = () => { shares = calc(); bindOrder(r, () => shares); };
  bal.oninput = recalc;
  pct.onchange = recalc;
  recalc();
}

/* ------------------------------------------------------------------ 주문 */
let TRADING = null;

async function tradingStatus() {
  if (!TRADING) {
    try { TRADING = await (await fetch("/api/trading/status")).json(); }
    catch (e) { TRADING = { configured: false, enabled: false }; }
  }
  return TRADING;
}

function orderBody(r, shares, dryRun) {
  return {
    symbol: r["종목코드"], name: r["종목명"], quantity: shares,
    entry: r["매수가"], stop: r["손절가"], target: (r["목표가"] || [])[0],
    dry_run: dryRun, ...(dryRun ? {} : { confirm: "실행" }),
  };
}

async function bindOrder(r, getShares) {
  const dryBtn = $("#od-dry"), liveBtn = $("#od-live"),
        mode = $("#od-mode"), box = $("#od-result");
  if (!dryBtn || !liveBtn) return;

  const t = await tradingStatus();
  const target = (r["목표가"] || [])[0];
  const acct = t.account ? `${t.account.accountNo}` : "계좌 확인 필요";

  if (!t.configured) {
    liveBtn.disabled = dryBtn.disabled = true;
    mode.textContent = "주문 기능이 구성되지 않았습니다 (합성/CSV 데이터 모드).";
  } else if (!t.enabled) {
    liveBtn.disabled = true;
    liveBtn.title = "실거래가 꺼져 있습니다 (.env 의 TOSS_TRADING_ENABLED=true 필요)";
    mode.innerHTML = `모의 전용 · ${acct} · 1회 한도 ${fmt(t.max_order_amount)}원
      <br>실주문은 <code>TOSS_TRADING_ENABLED=true</code> 설정 후 재시작해야 열립니다.`;
  } else {
    liveBtn.disabled = false;
    mode.innerHTML = `<b class="text-down">실거래 ON</b> · ${acct} ·
      1회 한도 ${fmt(t.max_order_amount)}원`;
  }

  const OD = { good: "border-good tint-good", bad: "border-bad tint-bad", "": "border-line bg-s1" };
  const show = (html, kind = "") =>
    { box.innerHTML = `<div class="mt-3 px-3 py-2 rounded-3 small border ${OD[kind]}">${html}</div>`; };

  const send = async (dryRun) => {
    const shares = getShares();
    if (!shares) return show("수량이 0입니다. 계좌 잔고나 허용 손실을 늘리세요.", "bad");
    if (!target) return show("목표가가 없어 익절 조건을 만들 수 없습니다.", "bad");
    dryBtn.disabled = liveBtn.disabled = true;
    show("전송 중…");
    try {
      const res = await fetch("/api/trading/order", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderBody(r, shares, dryRun)),
      });
      const data = await res.json();
      if (!res.ok) return show(`❌ ${data.detail || "주문 실패"}`, "bad");
      const p = data.plan;
      const steps = (data.steps || []).map(s =>
        `<li><b>${s["단계"]}</b> — ${s["상태"]} · ${s["내용"]}</li>`).join("");
      show(`<b>${data.dry_run ? "🧪 모의 실행 결과" : "✅ 주문 접수"}</b>
        <div class="text-body-tertiary my-1 mb-2">${data.message}</div>
        <ul class="m-0 ps-4">${steps}</ul>
        <div class="text-body-tertiary small">
          호가 정렬 후 — 매수 ${fmt(p.entry)} · 손절 ${fmt(p.stop)} · 익절 ${fmt(p.target)} ·
          ${fmt(p.quantity)}주 · 투입 ${fmt(p.amount)}원 ·
          최대 손실 −${fmt(p.risk_amount)}원 / 익절 시 +${fmt(p.reward_amount)}원</div>`,
        data.dry_run ? "" : "good");
    } catch (e) {
      show(`❌ 통신 오류: ${e}`, "bad");
    } finally {
      dryBtn.disabled = false;
      liveBtn.disabled = !(TRADING && TRADING.enabled);
    }
  };

  dryBtn.onclick = () => send(true);
  liveBtn.onclick = () => {
    const shares = getShares();
    const amount = shares * r["매수가"];
    const ok = confirm(
      `⚠ 실제 주문이 나갑니다. 되돌릴 수 없습니다.\n\n` +
      `${r["종목명"]} (${r["종목코드"]})\n` +
      `매수  지정가 ${fmt(r["매수가"])}원 × ${fmt(shares)}주 = ${fmt(amount)}원\n` +
      `손절  ${fmt(r["손절가"])}원  (최대 손실 −${fmt(shares * (r["매수가"] - r["손절가"]))}원)\n` +
      `익절  ${fmt(target)}원  (+${fmt(shares * (target - r["매수가"]))}원)\n\n` +
      `체결되면 손절·익절이 OCO 조건주문으로 자동 등록됩니다.\n진행할까요?`);
    if (ok) send(false);
  };
}

/* ---------------------------------------------------- 캔들 + 거래량 차트 */
function drawChart(candles, r) {
  const box = $("#chart-box");
  const W = 1000, H = 380, PL = 8, PR = 62, PT = 10, PB = 22;
  const PRICE_H = 250, GAP = 14, VOL_H = H - PT - PB - PRICE_H - GAP;
  const n = candles.length;
  const iw = (W - PL - PR) / n;             // 슬롯 폭
  const bw = Math.max(2, iw * 0.6);         // 몸통 폭

  const lines = [r["매수가"], r["손절가"]].filter(Number.isFinite);
  const lo = Math.min(...candles.map(c => c.low), ...lines);
  const hi = Math.max(...candles.map(c => c.high), ...lines);
  const pad = (hi - lo) * 0.08 || 1;
  const y = v => PT + PRICE_H - (v - lo + pad) / (hi - lo + pad * 2) * PRICE_H;
  const vmax = Math.max(...candles.map(c => c.volume)) || 1;
  const vy = v => PT + PRICE_H + GAP + VOL_H - (v / vmax) * VOL_H;
  const cx = i => PL + iw * (i + 0.5);
  const baseDate = r["기준봉일"];

  const ticks = 4, gridEls = [];
  for (let t = 0; t <= ticks; t++) {
    const val = lo - pad + (hi - lo + pad * 2) * t / ticks, gy = y(val);
    gridEls.push(`<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${W - PR + 6}" y="${(gy + 4).toFixed(1)}" fill="var(--text-muted)" font-size="11">${fmt(val)}</text>`);
  }

  const marks = candles.map((c, i) => {
    const up = c.close >= c.open;
    const col = up ? "var(--up)" : "var(--down)";
    const top = y(Math.max(c.open, c.close)), bot = y(Math.min(c.open, c.close));
    const h = Math.max(1, bot - top);
    const isBase = c.date === baseDate;
    return `${isBase ? `<rect x="${(cx(i) - iw / 2).toFixed(1)}" y="${PT}" width="${iw.toFixed(1)}" height="${PRICE_H + GAP + VOL_H}" fill="var(--warning)" opacity=".16"/>` : ""}
      <line x1="${cx(i).toFixed(1)}" y1="${y(c.high).toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${y(c.low).toFixed(1)}" stroke="${col}" stroke-width="1.5"/>
      <rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" rx="1"/>
      <rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${vy(c.volume).toFixed(1)}" width="${bw.toFixed(1)}" height="${(PT + PRICE_H + GAP + VOL_H - vy(c.volume)).toFixed(1)}" fill="${col}" opacity=".45" rx="1"/>`;
  }).join("");

  const refLine = (v, label, dash) => Number.isFinite(v) ? `
    <line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}"
          stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="${dash}"/>
    <text x="${PL + 4}" y="${(y(v) - 5).toFixed(1)}" fill="var(--text-secondary)" font-size="11">${label} ${fmt(v)}</text>` : "";

  const xLabels = candles.map((c, i) =>
    (i % Math.ceil(n / 8) === 0 || i === n - 1)
      ? `<text x="${cx(i).toFixed(1)}" y="${H - 6}" fill="var(--text-muted)" font-size="11" text-anchor="middle">${c.date.slice(5)}</text>` : ""
  ).join("");

  box.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${r["종목명"]} 최근 ${n}일 일봉 캔들과 거래량. 기준봉 ${baseDate} 강조.">
      ${gridEls.join("")}
      <text x="${PL + 2}" y="${PT + PRICE_H + GAP + 6}" fill="var(--text-muted)" font-size="11">거래량</text>
      ${marks}
      ${refLine(r["매수가"], "매수", "5 4")}
      ${refLine(r["손절가"], "손절", "2 3")}
      ${xLabels}
      <rect id="hit" x="${PL}" y="0" width="${W - PL - PR}" height="${H}" fill="transparent"/>
      <line id="cross" x1="0" y1="${PT}" x2="0" y2="${PT + PRICE_H + GAP + VOL_H}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    </svg>
    <div id="tip" class="position-absolute pe-none bg-s2 border border-line rounded-2 px-2 py-2 small text-nowrap shadow tnum" style="opacity:0;transition:opacity .1s;line-height:1.5;z-index:5"></</div>`;

  const svg = box.querySelector("svg"), tip = $("#tip"), cross = box.querySelector("#cross");
  svg.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const sx = (ev.clientX - rect.left) / rect.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.floor((sx - PL) / iw)));
    const c = candles[i];
    cross.setAttribute("x1", cx(i)); cross.setAttribute("x2", cx(i)); cross.setAttribute("opacity", ".7");
    tip.style.opacity = 1;
    tip.innerHTML = `<b class="d-block mb-1">${c.date}${c.date === baseDate ? " · 기준봉" : ""}</b>
      시 ${fmt(c.open)} · 고 ${fmt(c.high)}<br>저 ${fmt(c.low)} · 종 ${fmt(c.close)}<br>
      거래량 ${fmt(c.volume)}`;
    const px = cx(i) / W * rect.width;
    tip.style.left = Math.min(rect.width - tip.offsetWidth - 8, Math.max(0, px + 12)) + "px";
    tip.style.top = (ev.clientY - rect.top - 10) + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.opacity = 0; cross.setAttribute("opacity", "0"); });
}

/* ------------------------------------------------------------------ 액션 */
$("#scan-btn").onclick = async () => {
  if (STATE && STATE.configured === false) { Session.open(); return; }
  $("#scan-btn").disabled = true;
  await fetch("/api/scan", { method: "POST" });
  setTimeout(refresh, 600);
};

document.addEventListener("sessionchange", () => { SELECTED = null; $("#detail").innerHTML = ""; refresh(); });
refresh();
setInterval(refresh, 5000);
